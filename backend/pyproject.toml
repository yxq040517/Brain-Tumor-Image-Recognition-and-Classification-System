[project]
name = "neurolens-api"
version = "1.0.0"
description = "Local research-only brain MRI classification with pinned ViT weights"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.135,<0.144",
  "uvicorn>=0.38,<1",
  "python-multipart>=0.0.22,<1",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.46,<2.1",
  "pillow>=12.1,<13",
  "torch>=2.9,<3",
  "transformers>=4.57.3,<5",
  "safetensors>=0.7,<1",
  "httpx>=0.28,<1",
  "reportlab>=4.4,<5",
  "openpyxl>=3.1.5,<4",
]

[dependency-groups]
dev = ["ruff>=0.14,<1", "pytest>=9,<10"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
